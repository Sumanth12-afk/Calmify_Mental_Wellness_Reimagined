apiVersion: apps/v1
kind: Deployment
metadata:
  name: calmify-deployment
  namespace: default
  labels:
    app: calmify
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calmify
  template:
    metadata:
      labels:
        app: calmify
        version: v1
    spec:
      containers:
      - name: calmify
        image: ghcr.io/sumanth12-afk/calmify_mental_wellness_reimagined:latest
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        imagePullPolicy: Always
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: calmify-service
  namespace: default
  labels:
    app: calmify
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: calmify

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calmify-ingress
  namespace: default
  labels:
    app: calmify
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: calmify.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: calmify-service
            port:
              number: 80
